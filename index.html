<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>一封检讨书，请查收</title>
<meta property="og:title" content="一封检讨书，请查收">
<meta property="og:description" content="接受不接受，都随你 🥺">
<!-- 部署后如需自定义分享卡片，把下一行的注释打开并填绝对地址（同目录已备 share.jpg）。
     注意：微信内自定义分享卡片需公众号 JS-SDK 配置，普通 og 标签在部分环境生效 -->
<!-- <meta property="og:image" content="https://你的域名/share.jpg"> -->
<style>
  :root{
    --paper:#f6f1e5;
    --card:#fffdf6;
    --line:#e6dcc2;
    --ink:#3a3226;
    --ink-soft:#8a7c63;
    --red:#bf3a2b;
    --green:#95ec69;
    --chat-bg:#ededed;
    --warm1:#fdf3e2;
    --warm2:#f7e3c6;
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
    color:var(--ink);
    overflow:hidden;
    background:var(--paper);
    transition:background 1.1s ease;
    touch-action:manipulation;
    -webkit-user-select:none; user-select:none;
  }
  body.theme-warm{ background:linear-gradient(175deg,var(--warm1) 0%,var(--warm2) 100%); }
  body.theme-paper{ background:var(--paper); }

  .serif{ font-family:"Songti SC","Noto Serif SC","STSong","SimSun",serif; }

  /* ---------- 屏幕容器 ---------- */
  .screen{
    position:fixed; inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    padding:calc(20px + env(safe-area-inset-top)) 24px calc(26px + env(safe-area-inset-bottom));
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    max-width:520px;
    margin:0 auto;
  }
  .screen.active{ display:flex; animation:screenIn .55s ease both; }
  @keyframes screenIn{ from{ opacity:0; transform:translateY(18px); } to{ opacity:1; transform:none; } }
  .center{ justify-content:center; }

  /* ---------- 通用元素 ---------- */
  .kicker{
    font-size:12px; letter-spacing:.5em; text-indent:.5em;
    color:var(--ink-soft); margin-bottom:18px; white-space:nowrap;
  }
  .btn{
    display:block; width:100%; max-width:340px;
    border:none; cursor:pointer;
    background:var(--ink); color:#fdf9ee;
    font-size:16px; letter-spacing:.06em;
    padding:15px 20px; border-radius:999px;
    box-shadow:0 6px 18px rgba(58,50,38,.22);
    transition:transform .15s ease, box-shadow .15s ease;
    font-family:inherit;
  }
  .btn:active{ transform:scale(.96); box-shadow:0 3px 10px rgba(58,50,38,.2); }
  .btn.ghost{
    background:transparent; color:var(--ink-soft);
    box-shadow:none; border:1.5px solid #d8cdb2;
    font-size:15px; padding:12px 20px;
  }
  .btn.primary-acc{
    background:var(--red); color:#fff;
    font-size:17px; padding:16px 20px;
    box-shadow:0 8px 20px rgba(191,58,43,.3);
  }
  .appear{ animation:appear .6s ease both; }
  @keyframes appear{ from{ opacity:0; transform:translateY(12px); } to{ opacity:1; transform:none; } }

  /* ---------- S1 检讨书 ---------- */
  .letter{
    width:100%; max-width:360px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:30px 26px 34px;
    box-shadow:0 14px 34px rgba(93,78,52,.13);
    position:relative;
    animation:screenIn .7s ease both;
  }
  .letter-head{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:13px; color:var(--ink-soft); margin-bottom:20px;
  }
  .letter-body{ font-size:19px; line-height:2.05; min-height:230px; }
  .letter-body .l1{ font-weight:700; margin-bottom:10px; letter-spacing:.12em; }
  .caret{
    display:inline-block; width:2px; height:1.05em;
    background:var(--red); vertical-align:-0.15em; margin-left:2px;
    animation:blink .85s step-end infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }
  .sign{
    margin-top:22px; text-align:right;
    font-size:14px; color:var(--ink-soft);
  }
  .s1-tip{ margin-top:14px; font-size:12px; color:#c0b393; letter-spacing:.2em; }

  /* ---------- S2 逐句 ---------- */
  #s2{ justify-content:flex-start; }
  .dots{ display:flex; gap:9px; margin:4px 0 14px; }
  .dots i{
    width:9px; height:9px; border-radius:50%;
    background:#ddd2b6; transition:all .3s;
  }
  .dots i.on{ background:var(--red); transform:scale(1.15); }
  .s2-label{ font-size:13px; color:var(--ink-soft); letter-spacing:.18em; margin-bottom:12px; }
  .s2-step{ width:100%; max-width:380px; }

  /* 迷你微信聊天卡片 */
  .phone{
    background:var(--chat-bg);
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 10px 26px rgba(93,78,52,.14);
    margin-bottom:16px;
  }
  .phone-bar{
    background:#f8f8f8; border-bottom:1px solid #e3e3e3;
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px; font-size:14px; color:#222;
  }
  .phone-bar .ph-back{ color:#555; font-size:19px; line-height:1; }
  .phone-bar .ph-title{ font-weight:600; letter-spacing:.05em; }
  .phone-bar .ph-more{ color:#555; letter-spacing:.05em; }
  .phone-body{ padding:14px 12px 16px; display:flex; flex-direction:column; gap:11px; }
  .msg{ display:flex; gap:9px; align-items:flex-start; }
  .msg.me{ flex-direction:row-reverse; }
  .ava{
    width:34px; height:34px; flex:0 0 34px;
    border-radius:6px; background:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:19px; box-shadow:0 1px 2px rgba(0,0,0,.08);
  }
  .bubble{
    max-width:70%; padding:9px 12px;
    border-radius:6px; font-size:15px; line-height:1.5;
    position:relative; word-break:break-all;
  }
  .her .bubble{ background:#fff; }
  .her .bubble::before{
    content:""; position:absolute; left:-5px; top:12px;
    border:5px solid transparent; border-right-color:#fff; border-left:none;
  }
  .me .bubble{ background:var(--green); }
  .me .bubble::before{
    content:""; position:absolute; right:-5px; top:12px;
    border:5px solid transparent; border-left-color:var(--green); border-right:none;
  }
  .pic{ width:100px; border-radius:6px; display:block; }
  .msg.hl .bubble{
    outline:2.5px solid var(--red); outline-offset:2px;
    animation:pop .5s cubic-bezier(.2,1.6,.4,1) both .45s;
  }
  @keyframes pop{ 0%{ transform:scale(.92); } 60%{ transform:scale(1.05); } 100%{ transform:scale(1); } }
  .hl-tag{
    position:absolute; top:-13px; right:-10px;
    background:var(--red); color:#fff;
    font-size:11px; padding:3px 8px; border-radius:999px;
    transform:rotate(4deg); z-index:2;
    box-shadow:0 3px 8px rgba(191,58,43,.35);
    animation:pop .5s cubic-bezier(.2,1.6,.4,1) both .8s;
    white-space:nowrap;
  }

  /* 问题清单 */
  .verdict{
    width:100%;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px 20px 20px;
    box-shadow:0 8px 22px rgba(93,78,52,.1);
  }
  .v-head{
    font-size:15px; font-weight:700; letter-spacing:.08em;
    margin-bottom:12px; color:var(--red);
  }
  .verdict ol{ list-style:none; counter-reset:n; }
  .verdict li{
    counter-increment:n;
    font-size:15.5px; line-height:1.75;
    padding:7px 0 7px 34px; position:relative;
    animation:appear .5s ease both;
  }
  .verdict li:nth-child(1){ animation-delay:.15s; }
  .verdict li:nth-child(2){ animation-delay:.35s; }
  .verdict li:nth-child(3){ animation-delay:.55s; }
  .verdict li::before{
    content:counter(n);
    position:absolute; left:2px; top:10px;
    width:21px; height:21px; border-radius:50%;
    background:rgba(191,58,43,.1); color:var(--red);
    font-size:12.5px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .s2 .btn{ margin-top:20px; }

  /* ---------- S3 / S4 文字屏 ---------- */
  .talk{
    width:100%; max-width:350px;
    font-size:20px; line-height:2.15;
    text-align:center; white-space:normal;
  }
  .talk p{ margin-bottom:14px; animation:appear .9s ease backwards; }
  .talk p:nth-child(1){ animation-delay:.3s; }
  .talk p:nth-child(2){ animation-delay:1.5s; }
  .talk p:nth-child(3){ animation-delay:2.7s; }
  .talk .em{ color:var(--red); }
  .s3 .btn, .s4 .btn{ margin-top:34px; animation:appear .7s ease backwards 2.8s; }

  .meme-wrap{ margin-top:26px; text-align:center; }
  .meme{
    width:172px; border-radius:12px;
    transform:rotate(-4deg);
    box-shadow:0 12px 26px rgba(93,78,52,.22);
    animation:sway 3.2s ease-in-out infinite;
  }
  @keyframes sway{ 0%,100%{ transform:rotate(-4deg) translateY(0); } 50%{ transform:rotate(-1.5deg) translateY(-7px); } }
  .s4 .talk{ animation:appear .8s ease both; }
  .s4 .talk p{ animation:none; }
  .s4 .sorry{ animation:appear .9s ease backwards .9s; }
  .s4 .btn{ animation-delay:1.9s; }

  /* ---------- S5 检验 ---------- */
  .question{
    font-size:27px; font-weight:700; letter-spacing:.06em;
    text-align:center; line-height:1.7; margin-bottom:38px;
    animation:appear .8s ease both .2s;
  }
  .choices{ width:100%; max-width:320px; display:flex; flex-direction:column; gap:15px; }
  .choices .btn{ animation:appear .7s ease backwards; }
  .choices .btn:nth-child(1){ animation-delay:.6s; }
  .choices .btn:nth-child(2){ animation-delay:1s; }
  .shake{ animation:shake .45s ease both !important; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-7px); } 40%{ transform:translateX(6px); }
    60%{ transform:translateX(-4px); } 80%{ transform:translateX(3px); }
  }

  /* 不接受气泡 */
  #bubble{
    position:fixed; left:50%; bottom:190px;
    transform:translateX(-50%);
    width:min(320px, 82vw);
    background:#fff; border-radius:16px;
    padding:18px 20px 14px;
    box-shadow:0 14px 40px rgba(58,50,38,.28);
    z-index:50; display:none;
    pointer-events:none;
    font-size:16px; line-height:1.8; text-align:center;
  }
  #bubble.show{ display:block; animation:bpop .45s cubic-bezier(.2,1.5,.4,1) both; }
  @keyframes bpop{ 0%{ opacity:0; transform:translateX(-50%) scale(.5) translateY(24px); } 100%{ opacity:1; transform:translateX(-50%) scale(1) translateY(0); } }
  #bubble::after{
    content:""; position:absolute; left:50%; bottom:-8px;
    width:16px; height:16px; background:#fff;
    transform:translateX(-50%) rotate(45deg);
    box-shadow:6px 6px 12px rgba(58,50,38,.08);
  }
  #bubble .b-close{
    margin-top:10px; display:inline-block;
    pointer-events:auto;
    font-size:14px; color:var(--ink-soft);
    border:1px solid #ddd2b6; border-radius:999px;
    padding:6px 18px; background:#faf6ea;
  }
  #bubble .b-close:active{ transform:scale(.95); }

  /* ---------- 结果页 ---------- */
  .seal{
    width:132px; height:132px;
    border:4px solid var(--red); border-radius:18px;
    color:var(--red);
    display:flex; align-items:center; justify-content:center;
    font-size:37px; font-weight:900; letter-spacing:.1em;
    line-height:1.35; text-align:center;
    transform:rotate(-8deg);
    margin-bottom:30px;
    position:relative;
    animation:stamp .6s cubic-bezier(.25,1.5,.4,1) both .5s;
    text-shadow:0 0 1px rgba(191,58,43,.4);
    box-shadow:inset 0 0 14px rgba(191,58,43,.12);
  }
  @keyframes stamp{
    0%{ opacity:0; transform:scale(2.6) rotate(-16deg); }
    62%{ opacity:1; }
    100%{ opacity:1; transform:scale(1) rotate(-8deg); }
  }
  .result-copy{ text-align:center; font-size:21px; line-height:2; }
  .result-copy p{ animation:appear .9s ease backwards; }
  .result-copy p:nth-child(1){ animation-delay:1.15s; }
  .result-copy p:nth-child(2){ animation-delay:1.75s; }
  .result-copy .em{ color:var(--red); }

  .petal{
    position:fixed; top:-44px; z-index:5;
    pointer-events:none;
    animation:fall linear infinite;
    opacity:.9;
  }
  @keyframes fall{
    0%{ transform:translateY(0) rotate(0deg); }
    100%{ transform:translateY(112vh) rotate(330deg); }
  }
  .boom{
    position:fixed; z-index:4; pointer-events:none;
    width:12px; height:12px; border-radius:50%;
    border:3px solid; opacity:0;
    animation:boom 1s ease-out both;
  }
  @keyframes boom{
    0%{ opacity:1; transform:scale(.2); }
    100%{ opacity:0; transform:scale(9); }
  }
</style>
</head>

    <div class="kicker serif">· 说说我真正想说的 ·</div>

      <p>我的初衷，只是<em class="em">期待</em>看到你更多精彩的朋友圈和小红书作品。</p>

<script>
/* ================= 埋点配置 =================
   只记录 3 个事件：open(打开) / accept(点接受) / reject(点不接受,含次数)
   两种通知方式可任选、可同时用：
   1. endpoint：任何能收 POST JSON 的地址（如 Vercel 的 /api/track、飞书机器人 webhook）
   2. serverChanKey：Server酱 Turbo 的 SendKey（sctapi.ftqq.com），通知直接推到你微信
   都留空时仅在控制台打印，页面功能不受影响。 */
var TRACK = {
  endpoint: "",
  serverChanKey: "SCT418123T2cYDs3qktWbqn8ZMbkllyXHR"
};
var rejectCount = 0, opened = false;

function notify(payload){
  try{ console.log("[track]", payload.event, payload.count || ""); }catch(e){}
  if (TRACK.serverChanKey) {
    var t = payload.event === "accept" ? "她通过了你的检讨 ✅"
          : payload.event === "reject" ? ("她说不接受（第" + payload.count + "次）😤")
          : "她打开了你的检讨书 👀";
    var url = "https://sctapi.ftqq.com/" + TRACK.serverChanKey + ".send?title=" + encodeURIComponent(t);
    try{ fetch(url, { mode: "no-cors" }).catch(function(){}); }catch(e){}
  }
  if (TRACK.endpoint) {
    var body = JSON.stringify(payload);
    try{
      navigator.sendBeacon(TRACK.endpoint, new Blob([body], { type: "application/json" }));
    }catch(e){
      try{ fetch(TRACK.endpoint, { method:"POST", body: body, keepalive:true }).catch(function(){}); }catch(e2){}
    }
  }
}

function chatHTML(hi){
  var h = '';
  h += '<div class="phone">';
  h += '<div class="phone-bar"><span class="ph-back">‹</span><span class="ph-title">超级无敌大美女俊君子</span><span class="ph-more">···</span></div>';
  h += '<div class="phone-body">';
  h += '<div class="msg her"><div class="ava">🐱</div><img class="pic" src="' + RABBIT + '" alt=""></div>';
  h += '<div class="msg her"><div class="ava">🐱</div><div class="bubble">不错之</div></div>';
  for (var i = 0; i < 3; i++){
    h += '<div class="msg me' + (i === hi ? ' hl' : '') + '"><div class="ava">🐮</div><div class="bubble">' + SENTENCES[i]
      + (i === hi ? '<span class="hl-tag">❌ 第' + CN[i] + '句</span>' : '') + '</div></div>';
  }
  h += '<div class="msg her"><div class="ava">🐱</div><div class="bubble">…</div></div>';
  h += '</div></div>';

  h += '<div class="verdict"><div class="v-head">❌ 这句话的问题：</div><ol>';
  for (var j = 0; j < PROBLEMS[hi].length; j++){ h += '<li>' + PROBLEMS[hi][j] + '</li>'; }
  h += '</ol></div>';
  return h;
}

/* ================= 屏幕切换 ================= */
var s2idx = 0;
function $(id){ return document.getElementById(id); }

function renderS2(){
  $("s2step").innerHTML = chatHTML(s2idx);
  $("s2label").textContent = "逐句检讨 · 第 " + (s2idx + 1) + " / 3 句";
  var dots = $("dots").children;
  for (var i = 0; i < 3; i++){ dots[i].className = i <= s2idx ? "on" : ""; }
  $("btnS2").textContent = "next";
}
function go(id){
  var els = document.querySelectorAll(".screen");
  for (var i = 0; i < els.length; i++) els[i].classList.remove("active");
  var el = $(id);
  el.classList.add("active");
  el.scrollTop = 0;
  document.body.className = (id === "s1" || id === "s2") ? "theme-paper" : "theme-warm";
  save(id);
  if (id === "s6") celebrate();
}
function save(id){
  try{ sessionStorage.setItem("jiantao", JSON.stringify({ s: id, i: s2idx })); }catch(e){}
}

/* ================= S1 打字机 ================= */
var TW = [
  { el: "tw0", text: "我检讨：" },
  { el: "tw1", text: "我不该对你用心经营的美丽朋友圈随便指手画脚，发表那些无脑又缺乏审美的评价。" }
];
var twLine = 0, twChar = 0, typing = false, twTimer = null;

function typeStep(){
  if (twLine >= TW.length){ finishType(); return; }
  var el = $(TW[twLine].el);
  if (twChar < TW[twLine].text.length){
    el.textContent += TW[twLine].text.charAt(twChar++);
    twTimer = setTimeout(typeStep, TW[twLine].text.length > 6 ? 95 : 160);
  } else {
    twLine++; twChar = 0;
    twTimer = setTimeout(typeStep, 420);
  }
}
function finishType(){
  typing = false;
  clearTimeout(twTimer);
  for (var i = 0; i < TW.length; i++) $(TW[i].el).textContent = TW[i].text;
  $("caret").style.display = "none";
  $("s1tip").style.visibility = "hidden";
  var b = $("btnS1");
  b.style.visibility = "visible";
  b.classList.add("appear");
}
function startType(){
  typing = true;
  $("s1tip").style.visibility = "visible";
  setTimeout(typeStep, 500);
}
$("letterCard").addEventListener("click", function(){ if (typing) finishType(); });

    p.style.fontSize = (14 + Math.random() * 14) + "px";
    p.style.animationDuration = (4 + Math.random() * 4) + "s";
    p.style.animationDelay = (Math.random() * 4) + "s";
    document.body.appendChild(p);
  }
  var colors = ["#f4b63f", "#e86a5c", "#7fb069", "#e893b8"];
  var bursts = 0;
  var iv = setInterval(function(){
    for (var k = 0; k < 2; k++){
      var b = document.createElement("span");
      b.className = "boom";
      b.style.borderColor = colors[bursts % colors.length];
      b.style.left = (18 + Math.random() * 60) + "vw";
      b.style.top = (14 + Math.random() * 34) + "vh";
      document.body.appendChild(b);
      setTimeout(function(x){ return function(){ x.remove(); }; }(b), 1100);
    }
    if (++bursts >= 4) clearInterval(iv);
  }, 700);
}

/* ================= 事件绑定 ================= */
$("btnS1").addEventListener("click", function(){ s2idx = 0; renderS2(); go("s2"); });
$("btnS2").addEventListener("click", function(){
  if (s2idx < 2){ s2idx++; renderS2(); $("s2").scrollTop = 0; save("s2"); }
  else go("s3");
});
$("btnS3").addEventListener("click", function(){ go("s4"); });
$("btnS4").addEventListener("click", function(){ go("s5"); });

$("btnAccept").addEventListener("click", function(){
  closeBubble();
  notify({ event: "accept", ts: Date.now() });
  go("s6");
});
$("btnReject").addEventListener("click", function(){
  rejectCount++;
  notify({ event: "reject", count: rejectCount, ts: Date.now() });
  var b = $("bubble");
  var acc = $("btnAccept").getBoundingClientRect();
  b.style.bottom = Math.max(90, window.innerHeight - acc.top + 14) + "px";
  b.classList.remove("show");
  void b.offsetWidth;
  b.classList.add("show");
  var r = $("btnReject");
  r.classList.remove("shake"); void r.offsetWidth; r.classList.add("shake");
});
function closeBubble(){ $("bubble").classList.remove("show"); }
$("bubbleClose").addEventListener("click", closeBubble);
document.addEventListener("click", function(e){
  var b = $("bubble");
  if (b.classList.contains("show") && !b.contains(e.target) && e.target !== $("btnReject")) closeBubble();
}, true);

/* ================= 启动（支持刷新续看） ================= */
trackOpen();
(function(){
  var st = null;
  try{ st = JSON.parse(sessionStorage.getItem("jiantao")); }catch(e){}
  if (st && st.s && st.s !== "s1"){
    s2idx = st.i || 0;
    if (st.s === "s2") renderS2();
    if (st.s === "s6") celebrating = false;
    go(st.s);
  } else {
    go("s1");
    startType();
  }
})();
</script>
